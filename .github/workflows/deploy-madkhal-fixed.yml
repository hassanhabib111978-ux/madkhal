name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify unified Madkhal runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          required = [
              '<script src="./madkhal-ui-bridge.js" defer></script>',
              '<script src="./jibran.js"></script>'
          ]
          for tag in required:
              if tag not in s:
                  raise SystemExit(f"Missing core runtime reference: {tag}")
          for name in ["madkhal-ui-bridge.js", "jibran.js", "madkhal-jobs-data-fix.js"]:
              if not Path(name).exists():
                  raise SystemExit(f"Missing runtime file: {name}")
          if "madkhal-navigation-fix-v2.js" in s:
              raise SystemExit("Obsolete navigation layer must not be shipped")
          s = s.replace("دولار ونصف", "دولار واحد")
          p.write_text(s, encoding="utf-8")

          # Jibran remains available for its assistant functionality, but its
          # legacy worker-save/occupation wrappers are not part of the UI flow.
          j = Path("jibran.js")
          js = j.read_text(encoding="utf-8")
          save_call = "  installWorkerSaveFlowFix();"
          if save_call not in js:
              raise SystemExit("Expected legacy Jibran save wrapper call was not found")
          js = js.replace(save_call, "  // Unified Madkhal UI owns worker saving and completion navigation.")
          occupation_call = "  installArabicOccupationPicker();"
          if occupation_call in js:
              js = js.replace(occupation_call, "  // Unified worker form intentionally uses the agreed simple nine-field flow.")
          j.write_text(js, encoding="utf-8")
          print("Unified runtime verified; legacy worker wrappers disabled; old price text normalized")
      - name: Inject data compatibility layer only
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="./madkhal-jobs-data-fix.js?v=3"></script>'
          if tag not in s:
              s = s.replace("</body>", tag + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Only the jobs data compatibility layer is injected")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
