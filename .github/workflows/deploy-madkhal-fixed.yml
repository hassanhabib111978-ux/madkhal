name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Madkhal runtime fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tags = [
              '<script src="./madkhal-region-filter.js"></script>',
              '<script src="./madkhal-fix.js"></script>',
              '<script src="./madkhal-description-fix.js"></script>',
              '<script src="./madkhal-ui-fix.js"></script>',
              '<script src="./madkhal-translate.js"></script>',
              '<script src="./madkhal-consent-subscriptions.js"></script>',
              '<script src="./madkhal-match-ui.js"></script>',
              '<script src="./madkhal-evaluation-ui.js"></script>',
              '<script src="./madkhal-home-subscription-cleanup.js"></script>'
          ]
          if "</body>" not in s:
              raise SystemExit("index.html has no closing body tag")
          for tag in tags:
              if tag not in s:
                  s = s.replace("</body>", tag + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Madkhal runtime layers injected")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
