name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Madkhal runtime fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tags = [
              '<script src="./madkhal-region-filter.js"></script>',
              '<script src="./madkhal-fix.js"></script>',
              '<script src="./madkhal-description-fix.js"></script>',
              '<script src="./madkhal-ui-fix.js"></script>',
              '<script src="./madkhal-translate.js?v=2"></script>',
              '<script src="./madkhal-consent-subscriptions.js?v=9"></script>',
              '<script src="./madkhal-payment-flow-v2.js"></script>',
              '<script src="./madkhal-screen-visibility-fix.js?v=2"></script>',
              '<script src="./madkhal-match-ui.js"></script>',
              '<script src="./madkhal-evaluation-ui.js?v=4"></script>',
              '<script src="./madkhal-professional-score.js?v=1"></script>',
              '<script src="./madkhal-home-subscription-cleanup.js"></script>',
              '<script src="./madkhal-home-counter.js"></script>',
              '<script src="./madkhal-startup-home-guard.js?v=5"></script>',
              '<script src="./madkhal-confirm-repeat-fix.js?v=2"></script>',
              '<script src="./madkhal-native-confirm-fix.js?v=1"></script>',
              '<script src="./madkhal-navigation-fix-v2.js?v=1"></script>'
          ]
          if "</body>" not in s:
              raise SystemExit("index.html has no closing body tag")
          for tag in tags:
              base = tag.split("?")[0].replace('<script src="', '').replace('"></script>', '')
              old_prefix = '<script src="' + base + '"'
              for line in list(s.splitlines()):
                  if old_prefix in line and line.strip().startswith('<script src='):
                      s = s.replace(line, "")
          for tag in tags:
              if tag not in s:
                  s = s.replace("</body>", tag + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Madkhal runtime layers injected with cache-busting versions")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
