name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for release checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-deployment regression checks
        run: python -m unittest discover -s tests -v
      - name: Inject stable enhancements
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          scripts = [
              ("subscription-install-link.js", '<script src="./subscription-install-link.js"></script>'),
              ("payment-flexible-layer.js", '<script src="./payment-flexible-layer.js"></script>'),
              ("subscription-runtime.js", '<script src="./subscription-runtime.js"></script>'),
              ("employer-flow-enhancement.js", '<script src="./employer-flow-enhancement.js"></script>'),
              ("employer-dashboard-polish.js", '<script src="./employer-dashboard-polish.js"></script>'),
              ("worker-match-lifecycle.js", '<script src="./worker-match-lifecycle.js"></script>')
          ]
          for filename, tag in scripts:
              pattern = re.compile(r"""<script\b[^>]*\bsrc=["'](?:\./)?""" + re.escape(filename) + r"""(?:\?[^"']*)?["'][^>]*>\s*</script>""", re.IGNORECASE)
              if not pattern.search(s):
                  s = s.replace("</body>", "    " + tag + "\n</body>")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify final release after script injection
        run: python -m unittest discover -s tests -v

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
