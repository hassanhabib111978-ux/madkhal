name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup unified runtime
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          required='<script src="./madkhal-ui-bridge.js" defer></script>'
          if required not in s: raise SystemExit("Missing core runtime reference")
          for name in ["madkhal-ui-bridge.js","jibran.js","madkhal-jobs-data-fix.js"]:
              if not Path(name).exists(): raise SystemExit(f"Missing runtime file: {name}")
          if "madkhal-navigation-fix-v2.js" in s: raise SystemExit("Obsolete navigation layer must not be shipped")
          s=s.replace(required,'<script src="./madkhal-ui-bridge.js?v=9" defer></script>',1)
          s=s.replace("دولار ونصف","دولار واحد")
          p.write_text(s,encoding="utf-8")
          j=Path("jibran.js"); js=j.read_text(encoding="utf-8")
          if "  installWorkerSaveFlowFix();" in js: js=js.replace("  installWorkerSaveFlowFix();","  // Unified Madkhal UI owns worker saving and completion navigation.")
          if "  installArabicOccupationPicker();" in js: js=js.replace("  installArabicOccupationPicker();","  // Unified worker form intentionally uses the agreed simple nine-field flow.")
          j.write_text(js,encoding="utf-8")
          bridge=Path("madkhal-ui-bridge.js")
          bs=bridge.read_text(encoding="utf-8")
          employer_marker="/* MADKHAL_EMPLOYER_FLOW_V1 */"
          if employer_marker not in bs: raise SystemExit("Missing integrated employer runtime")
          tag='<script src="./madkhal-jobs-data-fix.js?v=3"></script>'
          if tag not in s: s=s.replace("</body>",tag+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
      - name: Validate runtime
        shell: python
        run: |
          from pathlib import Path
          b=Path("madkhal-ui-bridge.js").read_text(encoding="utf-8")
          for x in ["MADKHAL_EMPLOYER_FLOW_V1","create_employer_vacancy","window.submitEmployerVacancy"]:
              if x not in b: raise SystemExit(f"Missing integrated employer runtime: {x}")
          if b.count("MADKHAL_EMPLOYER_FLOW_V1") != 1: raise SystemExit("Employer runtime duplicated")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
