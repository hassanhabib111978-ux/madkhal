name: Deploy Madkhal fixed build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify and normalize core Madkhal runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          required = [
              '<script src="./madkhal-ui-bridge.js" defer></script>',
              '<script src="./jibran.js"></script>'
          ]
          for tag in required:
              if tag not in s:
                  raise SystemExit(f"Missing core runtime reference: {tag}")
          for name in ["madkhal-ui-bridge.js", "jibran.js", "madkhal-jobs-data-fix.js", "madkhal-worker-save-fix.js"]:
              if not Path(name).exists():
                  raise SystemExit(f"Missing runtime file: {name}")
          if "madkhal-navigation-fix-v2.js" in s:
              raise SystemExit("Obsolete navigation layer must not be shipped")
          s = s.replace("دولار ونصف شهريًا", "دولار واحد شهريًا")
          s = s.replace("دولار ونصف شهريًا.", "دولار واحد شهريًا.")
          p.write_text(s, encoding="utf-8")
          print("Core runtime verified and subscription price normalized")
      - name: Inject only the two required compatibility layers
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tags = [
              '<script src="./madkhal-jobs-data-fix.js?v=3"></script>',
              '<script src="./madkhal-worker-save-fix.js?v=5"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace("</body>", tag + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Only jobs and verified worker-save compatibility layers enabled")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
