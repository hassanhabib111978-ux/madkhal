name: Myself UAE Jobs Import

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

jobs:
  import-myself-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Import jobs from myself.ae
        env:
          SUPABASE_URL: https://qbufsdpdobuicpljnssr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEED_URL: https://www.admin.myself.ae/api/jobs-feed.json
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import hashlib
          import urllib.parse
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          FEED_URL = os.environ["FEED_URL"]

          if not SUPABASE_URL or not SUPABASE_KEY or not FEED_URL:
              raise SystemExit("ERROR: required importer configuration is missing")

          headers = {
              "User-Agent": "Madkhal-Jobs-Importer/1.0",
              "apikey": SUPABASE_KEY,
              "Authorization": f"Bearer {SUPABASE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
          }

          print("Downloading myself.ae feed...")

          req = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "Madkhal-Jobs-Importer/1.0"}
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.loads(response.read().decode("utf-8"))

          jobs = data.get("jobs", [])

          print(f"Jobs received from feed: {len(jobs)}")

          if not jobs:
              print("No jobs found in feed.")
              raise SystemExit(0)

          def clean(value):
              if value is None:
                  return None
              return str(value).strip()

          def parse_date(value):
              if not value:
                  return None

              value = str(value).strip()

              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.isoformat()
              except Exception:
                  return None

          def is_expired(value):
              if not value:
                  return False
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt <= datetime.now(timezone.utc)
              except Exception:
                  # An unparseable date must not silently expire a valid listing.
                  return False

          rows = []
          seen_references = set()

          for job in jobs:
              reference = clean(job.get("reference"))
              title = clean(job.get("title"))
              company = clean(job.get("company"))

              if reference and reference in seen_references:
                  continue

              canonical_url = clean(job.get("canonical_link"))
              source_url = clean(job.get("link")) or canonical_url

              if not reference or not title or not source_url:
                  continue
              seen_references.add(reference)

              description = clean(job.get("snippet"))
              location = clean(job.get("location"))
              city = clean(job.get("city"))
              state = clean(job.get("state"))

              country = clean(job.get("country")) or "United Arab Emirates"
              job_type = clean(job.get("type"))
              category = clean(job.get("category"))

              posted_at = parse_date(job.get("posted_at"))
              expires_at = parse_date(job.get("expires_at"))
              updated_at = parse_date(job.get("updated"))

              dedupe_string = f"myself.ae|{reference}"
              dedupe_hash = hashlib.sha256(
                  dedupe_string.encode("utf-8")
              ).hexdigest()

              rows.append({
                  "source": "myself.ae",
                  "source_job_id": reference,
                  "company": company,
                  "title": title,
                  "description": description,
                  "category": category,
                  "job_type": job_type,
                  "country": country,
                  "location": location or city or state,
                  "dedupe_hash": dedupe_hash,
                  "created_at": datetime.now(timezone.utc).isoformat(),
                  "last_checked_at": datetime.now(timezone.utc).isoformat(),
                  "confidence": 1.0,
                  "status": "expired" if is_expired(expires_at) else "active",
                  "expires_at": expires_at,
                  "updated_at": updated_at,
                  "posted_at": posted_at,
                  "canonical_url": canonical_url,
                  "source_url": source_url
              })

          print(f"Prepared rows: {len(rows)}")

          if not rows:
              print("No valid rows to insert.")
              raise SystemExit(0)

          # Check existing source IDs before any writes. This prevents each
          # hourly run from inserting duplicate rows for the same feed items.
          existing_references = set()
          for offset in range(0, len(rows), 50):
              reference_batch = [
                  row["source_job_id"] for row in rows[offset:offset + 50]
              ]
              quoted_references = ",".join(
                  '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
                  for value in reference_batch
              )
              params = urllib.parse.urlencode({
                  "select": "source_job_id",
                  "source": "eq.myself.ae",
                  "source_job_id": "in.(" + quoted_references + ")"
              })
              check_request = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/jobs?{params}",
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(check_request, timeout=60) as response:
                  existing_rows = json.loads(response.read().decode("utf-8"))
              existing_references.update(
                  str(row.get("source_job_id"))
                  for row in existing_rows
                  if row.get("source_job_id") is not None
              )

          existing_rows_to_refresh = [
              row for row in rows
              if row["source_job_id"] in existing_references
          ]
          new_rows = [
              row for row in rows
              if row["source_job_id"] not in existing_references
          ]
          print(f"Existing source records to refresh: {len(existing_rows_to_refresh)}")
          print(f"New source records to import: {len(new_rows)}")

          api_url = f"{SUPABASE_URL}/rest/v1/jobs"
          updated = 0
          inserted = 0

          # Refresh only rows included in the current feed. Preserve non-empty
          # stored values when the source omits optional fields, and never
          # reset the original created_at timestamp.
          for row in existing_rows_to_refresh:
              params = urllib.parse.urlencode({
                  "source": "eq.myself.ae",
                  "source_job_id": "eq." + row["source_job_id"]
              })
              update_payload = {
                  key: value for key, value in row.items()
                  if key != "created_at" and value not in (None, "")
              }
              update_request = urllib.request.Request(
                  f"{api_url}?{params}",
                  data=json.dumps(update_payload).encode("utf-8"),
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  },
                  method="PATCH"
              )
              with urllib.request.urlopen(update_request, timeout=60) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(
                          f"Refresh failed for source_job_id={row['source_job_id']}: HTTP {response.status}"
                      )
              updated += 1

          print(f"Existing source records refreshed: {updated}")

          batch_size = 50

          for i in range(0, len(new_rows), batch_size):
              batch = new_rows[i:i + batch_size]

              request = urllib.request.Request(
                  api_url,
                  data=json.dumps(batch).encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      response_body = response.read().decode("utf-8")
                      print(
                          f"Batch {i // batch_size + 1}: "
                          f"HTTP {response.status}"
                      )

                      if response_body:
                          print(response_body[:500])

                  inserted += len(batch)

              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"Supabase error: HTTP {e.code}")
                  print(body)
                  raise

          print(f"Import completed successfully: {inserted} new rows imported; {updated} existing source rows refreshed.")
          PY
