# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Madkhal navigation and clean temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''function scrollToScreenPosition(target, anchorId) {

  if (!target) return;

  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      const anchor = anchorId
        ? document.getElementById(anchorId)
        : null;

      const element = anchor || target;

      if (!element) return;

      const absoluteTop =
        window.pageYOffset +
        element.getBoundingClientRect().top;

      const offset =
        getMadkhalStickyOffset();

      const destination =
        Math.max(0, absoluteTop - offset);

      /*
       * الانتقال هنا فوري وليس smooth:
       * كل شاشة تُعرض وحدها، لذلك يجب أن يبدأ
       * العرض من موضعها الحقيقي دون أن يعيد
       * المتصفح تحريك الصفحة إلى موضع الزر السابق.
       */
      window.scrollTo({
        top: destination,
        behavior: "auto"
      });

      /*
       * تثبيت الموضع مرة إضافية بعد اكتمال
       * إعادة الرسم، خصوصًا على الهاتف.
       */
      requestAnimationFrame(() => {

        const finalTop =
          window.pageYOffset +
          element.getBoundingClientRect().top;

        const finalDestination =
          Math.max(
            0,
            finalTop - getMadkhalStickyOffset()
          );

        window.scrollTo({
          top: finalDestination,
          behavior: "auto"
        });

      });

    });

  });

}'''

          new = '''function scrollToScreenPosition(target, anchorId) {

  if (!target) return;

  const go = () => {
    const anchor = anchorId
      ? document.getElementById(anchorId)
      : null;

    const element = anchor || target;
    if (!element) return;

    const offset = getMadkhalStickyOffset();
    const rect = element.getBoundingClientRect();
    const destination = Math.max(
      0,
      window.pageYOffset + rect.top - offset
    );

    window.scrollTo({
      top: destination,
      left: 0,
      behavior: "auto"
    });

    if (anchor && typeof anchor.focus === "function") {
      try {
        anchor.focus({ preventScroll: true });
      } catch (_) {
        anchor.focus();
      }
    }
  };

  requestAnimationFrame(() => {
    go();
    setTimeout(go, 60);
    setTimeout(go, 220);
  });

}'''

          if old not in s:
              raise SystemExit('navigation helper block not found')
          s = s.replace(old, new, 1)

          old2 = '''  if (!sameScreen) {

    scrollToScreenPosition(
      target,
      anchorId
    );

  } else {

    requestAnimationFrame(() => {

      window.scrollTo({
        top: savedScroll,
        behavior: "auto"
      });

    });

  }'''

          new2 = '''  if (!sameScreen) {

    scrollToScreenPosition(
      target,
      anchorId
    );

  } else if (anchorId) {

    scrollToScreenPosition(
      target,
      anchorId
    );

  } else {

    window.scrollTo({
      top: savedScroll,
      left: 0,
      behavior: "auto"
    });

  }'''

          if old2 not in s:
              raise SystemExit('showScreen scroll branch not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/madkhal-navigation-fix.yml madkhal-navigation-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/madkhal-navigation-fix.yml madkhal-navigation-trigger.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Madkhal screen navigation"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
