# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One-time navigation repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MADKHAL_NAVIGATION_FIX_V1 */'
          if marker not in s:
              patch = r'''\n<script>\n/* MADKHAL_NAVIGATION_FIX_V1 */\n(function () {\n  "use strict";\n  function madkhalFixNavigationPosition() {\n    var active = document.querySelector(".screen.active");\n    if (!active) return;\n    window.requestAnimationFrame(function () {\n      var header = document.querySelector(".header");\n      var top = active.getBoundingClientRect().top + window.pageYOffset;\n      var offset = header ? header.getBoundingClientRect().height + 10 : 10;\n      window.scrollTo({ top: Math.max(0, top - offset), behavior: "smooth" });\n    });\n  }\n  document.addEventListener("click", function (event) {\n    var el = event.target && event.target.closest ? event.target.closest("button, a") : null;\n    if (!el) return;\n    var text = (el.textContent || "").trim();\n    var onclick = el.getAttribute("onclick") || "";\n    var navigation = /أبحث عن عمل|لدي فرصة عمل|الاشتراك|التقييم|ملف|البحث عن عمل|حسابي|الرئيسية|فرصة عمل|تقييم|اشتراك/i.test(text) || /showScreen|openSubscription|openEvaluation|worker|profile|assessment|subscription/i.test(onclick);\n    if (!navigation) return;\n    window.setTimeout(madkhalFixNavigationPosition, 120);\n  }, false);\n  window.addEventListener("hashchange", function () {\n    window.setTimeout(madkhalFixNavigationPosition, 80);\n  });\n})();\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('Cannot find </body> in index.html')
              s = s.replace('</body>', patch + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              import subprocess
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','index.html'], check=True)
              subprocess.run(['git','commit','-m','Madkhal navigation auto-fix [skip ci]'], check=True)
              subprocess.run(['git','push'], check=True)
              print('Navigation fix committed')
          else:
              print('Navigation fix already present')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
