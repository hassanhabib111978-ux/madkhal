# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correct navigation patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MADKHAL_NAVIGATION_FIX_V2 */'
          if marker not in s:
              patch = '''
<script>
/* MADKHAL_NAVIGATION_FIX_V2 */
(function () {
  "use strict";
  function madkhalFixNavigationPosition() {
    var active = document.querySelector(".screen.active");
    if (!active) return;
    window.requestAnimationFrame(function () {
      var header = document.querySelector(".header");
      var top = active.getBoundingClientRect().top + window.pageYOffset;
      var offset = header ? header.getBoundingClientRect().height + 10 : 10;
      window.scrollTo({ top: Math.max(0, top - offset), behavior: "smooth" });
    });
  }
  document.addEventListener("click", function (event) {
    var el = event.target && event.target.closest ? event.target.closest("button, a") : null;
    if (!el) return;
    var text = (el.textContent || "").trim();
    var onclick = el.getAttribute("onclick") || "";
    var navigation = /أبحث عن عمل|لدي فرصة عمل|الاشتراك|التقييم|ملف|البحث عن عمل|حسابي|الرئيسية|فرصة عمل|تقييم|اشتراك/i.test(text) || /showScreen|openSubscription|openEvaluation|worker|profile|assessment|subscription/i.test(onclick);
    if (!navigation) return;
    window.setTimeout(madkhalFixNavigationPosition, 120);
  }, false);
  window.addEventListener("hashchange", function () {
    window.setTimeout(madkhalFixNavigationPosition, 80);
  });
})();
</script>
'''
              if '</body>' not in s:
                  raise SystemExit('Cannot find </body> in index.html')
              s = s.replace('</body>', patch + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','index.html'], check=True)
              subprocess.run(['git','commit','-m','Madkhal navigation auto-fix [skip ci]'], check=True)
              subprocess.run(['git','push'], check=True)
              print('Navigation V2 committed')
          else:
              print('Navigation V2 already present')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# final trigger
