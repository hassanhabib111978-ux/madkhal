name: Attach Jibran companion

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach Jibran once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./jibran.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Jibran already attached"
          else
            git commit -m "Attach Jibran companion"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/attach-jibran-final.yml
          git add .github/workflows/attach-jibran-final.yml
          if git diff --cached --quiet; then
            echo "Temporary workflow already absent"
          else
            git commit -m "Remove temporary Jibran attachment workflow"
            git push
          fi
