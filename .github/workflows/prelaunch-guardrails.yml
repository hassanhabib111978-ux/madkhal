name: Prelaunch Guardrails

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-guardrails:
    name: Python regression guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check account recovery JavaScript syntax
        run: node --check account-recovery.js

      - name: Run repository regression checks
        run: python -m unittest discover -s tests -v
