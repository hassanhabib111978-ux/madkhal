name: Bind Madkhal UI bridge

on:
  push:
    branches: [main]
    paths:
      - 'madkhal-ui-bridge.js'
      - '.github/workflows/bind-madkhal-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bind bridge script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./madkhal-ui-bridge.js" defer></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Missing </head> in index.html')
              s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('bridge inserted')
          else:
              print('bridge already present')

      - name: Commit binding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change required.'
            exit 0
          fi
          git commit -m 'Bind Madkhal UI bridge to index.html'
          git push
