name: UN Careers Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-un-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Import UN Careers jobs
        env:
          SUPABASE_URL: https://qbufsdpdobuicpljnssr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import hashlib
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime, timezone

          SUPABASE_URL = os.environ.get("SUPABASE_URL", "").rstrip("/")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY", "")

          if not SUPABASE_URL:
              raise SystemExit("ERROR: SUPABASE_URL is missing")
          if not SUPABASE_KEY:
              raise SystemExit("ERROR: SUPABASE_SERVICE_ROLE_KEY secret is missing")

          FEED_URL = "https://careers.un.org/jobfeed?isPage=true"

          print("Fetching UN Careers feed...")

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Madkhal-Jobs-Importer/1.0",
                  "Accept": "application/rss+xml, application/xml, text/xml"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  raw = response.read()

          except Exception as error:
              raise SystemExit(
                  f"UN Careers request failed: {error}"
              )

          print(f"Response received: {len(raw)} bytes")

          try:
              root = ET.fromstring(raw)
          except Exception as error:
              print(raw[:500])
              raise SystemExit(
                  f"UN Careers feed is not valid XML: {error}"
              )

          items = root.findall(".//item")

          print(f"UN Careers jobs found: {len(items)}")

          if not items:
              raise SystemExit(
                  "No jobs found in UN Careers feed."
              )

          inserted = 0
          updated = 0
          skipped = 0
          failed = 0

          def text(item, tag):
              node = item.find(tag)
              if node is None or node.text is None:
                  return ""
              return node.text.strip()

          for item in items:

              title = text(item, "title")
              link = text(item, "link")
              description = text(item, "description")

              job_id = ""

              match = re.search(
                  r"/(\d+)(?:\?|$)",
                  link
              )

              if match:
                  job_id = match.group(1)

              if not job_id:
                  guid = text(item, "guid")
                  match = re.search(
                      r"(\d+)",
                      guid
                  )
                  if match:
                      job_id = match.group(1)

              if not job_id or not title or not link:
                  skipped += 1
                  continue

              company = "United Nations"

              source_url = link

              country = ""
              location = ""

              for keyword in [
                  "Duty Station",
                  "Duty station"
              ]:
                  match = re.search(
                      keyword + r"\s*:\s*([^<\n]+)",
                      description,
                      re.IGNORECASE
                  )

                  if match:
                      location = match.group(1).strip()
                      break

              category = ""

              match = re.search(
                  r"Job Network\s*:\s*([^<\n]+)",
                  description,
                  re.IGNORECASE
              )

              if match:
                  category = match.group(1).strip()

              job_type = ""

              match = re.search(
                  r"Recruitment Type\s*:\s*([^<\n]+)",
                  description,
                  re.IGNORECASE
              )

              if match:
                  job_type = match.group(1).strip()

              dedupe_hash = hashlib.md5(
                  f"UN Careers:{job_id}".encode()
              ).hexdigest()

              params = urllib.parse.urlencode({
                  "source": "eq.UN Careers",
                  "source_job_id": f"eq.{job_id}"
              })

              check_url = (
                  f"{SUPABASE_URL}/rest/v1/jobs?"
                  f"{params}&select=id&limit=1"
              )

              check_request = urllib.request.Request(
                  check_url,
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      check_request,
                      timeout=30
                  ) as response:

                      existing = json.loads(
                          response.read().decode("utf-8")
                      )

              except Exception as error:
                  raise SystemExit(
                      f"Supabase check failed: {error}"
                  )

              payload = {
                  "source": "UN Careers",
                  "source_job_id": job_id,
                  "company": company,
                  "title": title,
                  "description": description,
                  "category": category,
                  "job_type": job_type,
                  "country": country,
                  "location": location,
                  "source_url": source_url,
                  "canonical_url": source_url,
                  "status": "active",
                  "confidence": 1.0,
                  "dedupe_hash": dedupe_hash,
                  "last_checked_at": datetime.now(timezone.utc).isoformat()
              }
              payload_to_write = {
                  key: value for key, value in payload.items()
                  if value not in (None, "")
              }
              params = urllib.parse.urlencode({
                  "source": "eq.UN Careers",
                  "source_job_id": "eq." + job_id
              })

              if existing:
                  write_request = urllib.request.Request(
                      f"{SUPABASE_URL}/rest/v1/jobs?{params}",
                      data=json.dumps(payload_to_write).encode("utf-8"),
                      method="PATCH",
                      headers={
                          "apikey": SUPABASE_KEY,
                          "Authorization": f"Bearer {SUPABASE_KEY}",
                          "Content-Type": "application/json",
                          "Prefer": "return=minimal"
                      }
                  )
              else:
                  write_request = urllib.request.Request(
                      f"{SUPABASE_URL}/rest/v1/jobs",
                      data=json.dumps(payload_to_write).encode("utf-8"),
                      method="POST",
                      headers={
                          "apikey": SUPABASE_KEY,
                          "Authorization": f"Bearer {SUPABASE_KEY}",
                          "Content-Type": "application/json",
                          "Prefer": "return=minimal"
                      }
                  )

              try:
                  with urllib.request.urlopen(write_request, timeout=30) as response:
                      if response.status not in (200, 201, 204):
                          raise RuntimeError(
                              f"Unexpected Supabase status {response.status}"
                          )
                      if existing:
                          updated += 1
                      else:
                          inserted += 1
              except Exception as error:
                  action = "Refresh" if existing else "Insert"
                  print(f"{action} failed for {title}: {error}")
                  failed += 1

          print("--------------------------------")
          print("UN Careers import summary")
          print(f"Inserted: {inserted}")
          print(f"Refreshed existing live jobs: {updated}")
          print(f"Skipped (invalid records): {skipped}")
          print(f"Failed: {failed}")
          print("--------------------------------")

          if failed:
              raise SystemExit(1)
          PY
