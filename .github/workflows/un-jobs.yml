name: UN Jobs Import

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Test Supabase connection
        env:
          SUPABASE_URL: https://qbufsdpdobuicpljnssr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          curl -i \
            -X POST \
            "${SUPABASE_URL}/rest/v1/jobs" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "source": "UN Careers",
              "source_job_id": "GITHUB-ACTION-TEST-001",
              "company": "United Nations",
              "title": "GitHub Actions Connection Test",
              "description": "Temporary test record for Madkhal.",
              "category": "Test",
              "job_type": "Test",
              "country": "Syria",
              "location": "Damascus",
              "source_url": "https://careers.un.org/",
              "canonical_url": "https://careers.un.org/",
              "status": "active",
              "confidence": 1.0,
              "dedupe_hash": "GITHUB-ACTION-TEST-001"
            }'
