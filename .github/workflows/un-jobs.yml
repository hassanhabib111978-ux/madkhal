name: Jobs Import

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  import-himalayas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Import Himalayas jobs
        env:
          SUPABASE_URL: https://qbufsdpdobuicpljnssr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import hashlib

          SUPABASE_URL = os.environ.get("SUPABASE_URL", "").rstrip("/")
          SUPABASE_KEY = os.environ.get("SUPABASE_KEY", "")

          if not SUPABASE_URL:
              raise SystemExit("ERROR: SUPABASE_URL is missing")
          if not SUPABASE_KEY:
              raise SystemExit("ERROR: SUPABASE_SERVICE_ROLE_KEY secret is missing")

          API_URL = "https://himalayas.app/jobs/api"

          print("Fetching Himalayas jobs...")

          request = urllib.request.Request(
              API_URL,
              headers={
                  "User-Agent": "Madkhal-Jobs-Importer/1.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          jobs = data.get("jobs", [])

          print(f"Jobs received: {len(jobs)}")

          inserted = 0
          skipped = 0
          failed = 0

          for job in jobs:

              job_id = str(
                  job.get("id")
                  or job.get("jobId")
                  or job.get("url")
                  or ""
              ).strip()

              title = str(
                  job.get("title") or ""
              ).strip()

              company = str(
                  job.get("companyName")
                  or job.get("company")
                  or ""
              ).strip()

              description = str(
                  job.get("description") or ""
              )

              source_url = str(
                  job.get("url")
                  or job.get("applicationLink")
                  or ""
              ).strip()

              if not job_id or not title or not source_url:
                  skipped += 1
                  continue

              location = str(
                  job.get("location") or ""
              ).strip()

              country = str(
                  job.get("country") or ""
              ).strip()

              category = str(
                  job.get("category") or ""
              ).strip()

              job_type = str(
                  job.get("employmentType")
                  or job.get("jobType")
                  or ""
              ).strip()

              dedupe_hash = hashlib.md5(
                  f"himalayas:{job_id}".encode()
              ).hexdigest()

              params = urllib.parse.urlencode({
                  "source": "eq.himalayas",
                  "source_job_id": f"eq.{job_id}"
              })

              check_url = (
                  f"{SUPABASE_URL}/rest/v1/jobs?"
                  f"{params}&select=id&limit=1"
              )

              check_request = urllib.request.Request(
                  check_url,
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}"
                  }
              )

              with urllib.request.urlopen(
                  check_request,
                  timeout=30
              ) as response:

                  existing = json.loads(
                      response.read().decode("utf-8")
                  )

              if existing:
                  skipped += 1
                  continue

              payload = {
                  "source": "himalayas",
                  "source_job_id": job_id,
                  "company": company,
                  "title": title,
                  "description": description,
                  "category": category,
                  "job_type": job_type,
                  "country": country,
                  "location": location,
                  "source_url": source_url,
                  "canonical_url": source_url,
                  "status": "active",
                  "confidence": 1.0,
                  "dedupe_hash": dedupe_hash
              }

              body = json.dumps(payload).encode("utf-8")

              insert_request = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/jobs",
                  data=body,
                  method="POST",
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      insert_request,
                      timeout=30
                  ) as response:

                      if response.status in (200, 201, 204):
                          inserted += 1
                      else:
                          skipped += 1

              except Exception as error:
                  print(
                      f"Insert failed: {title} - {error}"
                  )
                  failed += 1

          print("--------------------------------")
          print("Himalayas import summary")
          print(f"Inserted: {inserted}")
          print(f"Skipped (invalid or already present): {skipped}")
          print(f"Failed: {failed}")
          print("--------------------------------")

          if failed:
              raise SystemExit(1)
          PY
