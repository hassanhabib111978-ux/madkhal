name: Jobs Import

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  import-himalayas:
    runs-on: ubuntu-latest

    steps:
      - name: Import Himalayas jobs
        env:
          SUPABASE_URL: https://qbufsdpdobuicpljnssr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          import urllib.parse

          SUPABASE_URL = "https://qbufsdpdobuicpljnssr.supabase.co"
          SUPABASE_KEY = "${SUPABASE_KEY}"

          API_URL = "https://himalayas.app/jobs/api"

          headers = {
              "User-Agent": "Madkhal-Jobs-Importer/1.0",
              "Accept": "application/json"
          }

          print("Fetching Himalayas jobs...")

          request = urllib.request.Request(API_URL, headers=headers)

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          jobs = data.get("jobs", [])

          print(f"Jobs received from Himalayas: {len(jobs)}")

          if not jobs:
              raise SystemExit("No jobs received from Himalayas.")

          inserted = 0
          skipped = 0

          for item in jobs:

              job_id = str(
                  item.get("id")
                  or item.get("jobId")
                  or item.get("url")
                  or ""
              ).strip()

              title = str(item.get("title") or "").strip()

              company = str(
                  item.get("companyName")
                  or item.get("company")
                  or ""
              ).strip()

              description = str(
                  item.get("description")
                  or ""
              )

              source_url = str(
                  item.get("url")
                  or item.get("applicationLink")
                  or ""
              ).strip()

              if not job_id or not title or not source_url:
                  skipped += 1
                  continue

              location = str(
                  item.get("location")
                  or ""
              ).strip()

              country = str(
                  item.get("country")
                  or ""
              ).strip()

              category = str(
                  item.get("category")
                  or ""
              ).strip()

              job_type = str(
                  item.get("employmentType")
                  or item.get("jobType")
                  or ""
              ).strip()

              dedupe_hash = hashlib.md5(
                  f"himalayas:{job_id}".encode()
              ).hexdigest()

              params = urllib.parse.urlencode({
                  "source": "eq.himalayas",
                  "source_job_id": f"eq.{job_id}"
              })

              check_url = (
                  f"{SUPABASE_URL}/rest/v1/jobs?{params}"
                  f"&select=id&limit=1"
              )

              check_request = urllib.request.Request(
                  check_url,
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}"
                  }
              )

              with urllib.request.urlopen(
                  check_request,
                  timeout=30
              ) as check_response:

                  existing = json.loads(
                      check_response.read().decode("utf-8")
                  )

              if existing:
                  skipped += 1
                  continue

              payload = {
                  "source": "himalayas",
                  "source_job_id": job_id,
                  "company": company,
                  "title": title,
                  "description": description,
                  "category": category,
                  "job_type": job_type,
                  "country": country,
                  "location": location,
                  "source_url": source_url,
                  "canonical_url": source_url,
                  "status": "active",
                  "confidence": 1.0,
                  "dedupe_hash": dedupe_hash
              }

              body = json.dumps(payload).encode("utf-8")

              insert_request = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/jobs",
                  data=body,
                  method="POST",
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": f"Bearer {SUPABASE_KEY}",
                      "Content-Type": "application/json",
                      "Prefer": "return=minimal"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      insert_request,
                      timeout=30
                  ) as insert_response:

                      if insert_response.status in (200, 201, 204):
                          inserted += 1
                      else:
                          skipped += 1

              except Exception as e:
                  print(
                      f"Insert failed for {title}: {e}"
                  )
                  skipped += 1

          print("================================")
          print("Himalayas import completed")
          print(f"Inserted: {inserted}")
          print(f"Skipped: {skipped}")
          print("================================")
          PY
