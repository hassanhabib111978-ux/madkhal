name: app-validation
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate core JavaScript
        run: |
          node --check subscription-runtime.js
          node --check worker-match-lifecycle.js
          node --check employer-flow-enhancement.js
