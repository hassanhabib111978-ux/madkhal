<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مَدخَل - المدخل إلى سوق العمل الإلكتروني</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

header {
    padding: 15px 0;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.hero {
    text-align: center;
    padding: 65px 15px 50px;
}

.hero h1 {
    font-size: 58px;
    margin: 0 0 15px;
}

.hero p {
    font-size: 22px;
    color: #5d6678;
    line-height: 1.8;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 16px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: white;
    color: #172033;
    border: 1px solid #dce2ec;
}

.section {
    display: none;
    background: white;
    border-radius: 18px;
    padding: 30px;
    margin: 20px 0 40px;
    border: 1px solid #e4e8f0;
}

.section h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #dce2ec;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 7px;
}

textarea {
    min-height: 120px;
}

.action-button {
    background: #2563eb;
    color: white;
}

.back-button {
    background: #eef2f7;
    color: #172033;
}

.opportunity {
    border: 1px solid #e4e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

footer {
    text-align: center;
    color: #7b8494;
    border-top: 1px solid #e2e6ee;
    padding: 25px 0;
}

@media (max-width: 700px) {
    .hero h1 {
        font-size: 45px;
    }

    .hero p {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        مَدخَل<span>.</span>
    </div>
</header>

<section class="hero" id="home">

    <h1>مَدخَل</h1>

    <p>
        المدخل إلى سوق العمل الإلكتروني
    </p>

    <div class="buttons">

        <button type="button" class="primary" onclick="showSection('worker')">
            💼 أبحث عن عمل
        </button>

        <button type="button" class="secondary" onclick="showSection('project')">
            📋 لدي مشروع
        </button>

        <button type="button" class="secondary" onclick="showSection('opportunities')">
            🔍 تصفح الفرص
        </button>

    </div>

</section>

<section class="section" id="worker">

    <h2>💼 أبحث عن عمل</h2>

    <p>أنشئ ملفك وأخبرنا بالمهارات التي تستطيع تقديم
